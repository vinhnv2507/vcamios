name: Build tweak

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - native-experiment

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        uses: Randomblock1/theos-action@v1

      - name: Build rootful package
        run: |
          set +e
          make package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/rootful-build.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            grep -Ei "error:|fatal error|undefined symbol|ld:" "$RUNNER_TEMP/rootful-build.log" | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$build_status"
          fi
          set -e
          mkdir -p built-packages
          rootful_deb="$(find packages -maxdepth 1 -name '*_iphoneos-arm.deb' -print -quit)"
          test -n "$rootful_deb"
          cp "$rootful_deb" built-packages/

      - name: Build rootless package
        run: |
          make clean
          sed -i 's/^Architecture:.*/Architecture: iphoneos-arm64/' control
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          rootless_deb="$(find packages -maxdepth 1 -name '*_iphoneos-arm64.deb' -print -quit)"
          test -n "$rootless_deb"
          cp "$rootless_deb" built-packages/

      - name: Build RootHide package
        run: |
          set -e
          standard_theos="$THEOS"
          roothide_theos="$RUNNER_TEMP/theos-roothide"
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$roothide_theos"
          # Reuse the iOS SDK downloaded by the Theos action.
          mkdir -p "$roothide_theos/sdks"
          cp -a "$standard_theos/sdks/." "$roothide_theos/sdks/"
          mkdir -p "$roothide_theos/toolchain"
          cp -a "$standard_theos/toolchain/." "$roothide_theos/toolchain/"
          mkdir -p "$roothide_theos/vendor/include" "$roothide_theos/vendor/lib"
          cp -a "$standard_theos/vendor/include/." "$roothide_theos/vendor/include/" || true
          cp -a "$standard_theos/vendor/lib/." "$roothide_theos/vendor/lib/" || true
          curl -L --fail --retry 3 https://github.com/RootHide/libroothide/files/12643716/devkit.zip -o "$RUNNER_TEMP/roothide-devkit.zip"
          unzip -q "$RUNNER_TEMP/roothide-devkit.zip" -d "$RUNNER_TEMP/roothide-devkit"
          cp "$RUNNER_TEMP/roothide-devkit/devkit/roothide/roothide.h" "$roothide_theos/vendor/include/"
          cp "$RUNNER_TEMP/roothide-devkit/devkit/roothide/libroothide.tbd" "$roothide_theos/vendor/lib/"
          make clean
          sed -i 's/^Architecture:.*/Architecture: iphoneos-arm64e/' control
          set +e
          THEOS="$roothide_theos" ARCHS=arm64e make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee "$RUNNER_TEMP/roothide-build.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            # Mirror the tail into workflow annotations so failures remain
            # diagnosable even when GitHub's log endpoint is unavailable.
            tail -n 40 "$RUNNER_TEMP/roothide-build.log" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$build_status"
          fi
          set -e
          roothide_deb="$(find packages -maxdepth 1 -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$roothide_deb"
          cp "$roothide_deb" built-packages/

      - name: Validate Debian packages
        run: |
          rootful_deb="$(find built-packages -maxdepth 1 -name '*_iphoneos-arm.deb' -print -quit)"
          rootless_deb="$(find built-packages -maxdepth 1 -name '*_iphoneos-arm64.deb' -print -quit)"
          roothide_deb="$(find built-packages -maxdepth 1 -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$rootful_deb"
          test -n "$rootless_deb"
          test -n "$roothide_deb"
          test "$(dpkg-deb --field "$rootful_deb" Package)" = "com.yourcompany.vcam"
          test "$(dpkg-deb --field "$rootful_deb" Architecture)" = "iphoneos-arm"
          dpkg-deb --contents "$rootful_deb" | grep -q 'Library/MobileSubstrate/DynamicLibraries/vcam.dylib'
          dpkg-deb --contents "$rootful_deb" | grep -q 'Library/MobileSubstrate/DynamicLibraries/VCamOverlay.dylib'
          dpkg-deb --contents "$rootful_deb" | grep -q 'Applications/VCam.app/VCam'
          if dpkg-deb --contents "$rootful_deb" | grep -q 'var/jb'; then
            echo "Rootless path found in rootful package" >&2
            exit 1
          fi
          test "$(dpkg-deb --field "$rootless_deb" Package)" = "com.yourcompany.vcam"
          test "$(dpkg-deb --field "$rootless_deb" Architecture)" = "iphoneos-arm64"
          dpkg-deb --contents "$rootless_deb" | grep -q 'var/jb/Library/MobileSubstrate/DynamicLibraries/vcam.dylib'
          dpkg-deb --contents "$rootless_deb" | grep -q 'var/jb/Library/MobileSubstrate/DynamicLibraries/VCamOverlay.dylib'
          dpkg-deb --contents "$rootless_deb" | grep -q 'var/jb/Applications/VCam.app/VCam'
          test "$(dpkg-deb --field "$roothide_deb" Package)" = "com.yourcompany.vcam"
          test "$(dpkg-deb --field "$roothide_deb" Architecture)" = "iphoneos-arm64e"
          dpkg-deb --contents "$roothide_deb" | grep -q 'Applications/VCam.app/VCam'

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: vcam-rootful-rootless-roothide-debs
          path: built-packages/*.deb
          if-no-files-found: error

      - name: Publish raw DEB in Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view vcam-packages >/dev/null 2>&1; then
            gh release upload vcam-packages built-packages/*.deb --clobber
          else
            gh release create vcam-packages built-packages/*.deb \
              --title "VCam rootful, rootless and RootHide" \
              --notes "Packages for rootful (iphoneos-arm), rootless (iphoneos-arm64) and RootHide (iphoneos-arm64e) jailbreaks."
          fi

      - name: Create flat APT repository
        if: github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev
          mkdir -p apt-repo
          cp built-packages/*.deb apt-repo/
          touch apt-repo/.nojekyll
          repo_deb="$(find apt-repo -maxdepth 1 -name '*.deb' -print -quit)"
          repo_version="$(dpkg-deb --field "$repo_deb" Version)"
          cd apt-repo
          apt-ftparchive packages . > Packages
          gzip -9c Packages > Packages.gz
          bzip2 -9c Packages > Packages.bz2
          xz -9c Packages > Packages.xz
          python3 - <<'PY'
          from pathlib import Path
          import gzip, bz2, lzma
          raw = Path("Packages").read_text()
          records = [r.strip() for r in raw.split("\n\n") if r.strip()]
          by_arch = {}
          for rec in records:
              arch = next((line.split(": ", 1)[1].strip() for line in rec.splitlines() if line.startswith("Architecture: ")), None)
              if not arch:
                  continue
              by_arch.setdefault(arch, []).append(rec)
          for arch, recs in by_arch.items():
              dest = Path("dists/stable/main/binary-%s" % arch)
              dest.mkdir(parents=True, exist_ok=True)
              body = "\n\n".join(recs) + "\n"
              data = body.encode()
              (dest / "Packages").write_text(body)
              (dest / "Packages.gz").write_bytes(gzip.compress(data, 9))
              (dest / "Packages.bz2").write_bytes(bz2.compress(data, 9))
              (dest / "Packages.xz").write_bytes(lzma.compress(data))
          PY
          cd ..
          release_checksums="$(mktemp)"
          (cd apt-repo && apt-ftparchive release .) > "$release_checksums"
          {
            echo "Origin: VCam"
            echo "Label: VCam rootful, rootless and RootHide"
            echo "Suite: stable"
            echo "Version: $repo_version"
            echo "Codename: vcam"
            echo "Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e"
            echo "Components: main"
            echo "Description: VCam repository for rootful, rootless and RootHide jailbreaks"
            cat "$release_checksums"
          } > apt-repo/Release
          mkdir -p apt-repo/dists/stable
          cp apt-repo/Release apt-repo/dists/stable/Release
          rm -f "$release_checksums"

      - name: Publish APT repository branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ./apt-repo
          force_orphan: true

      - name: Publish native experiment release
        if: github.ref == 'refs/heads/native-experiment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view vcam-native-packages >/dev/null 2>&1; then
            gh release upload vcam-native-packages built-packages/*.deb --clobber
          else
            gh release create vcam-native-packages built-packages/*.deb \
              --title "VCam native VideoToolbox experiment" \
              --notes "VCam 0.0.110-webrtc-only: live-link UI now exposes WebRTC/WHEP only; legacy image-live, video-live and native choices are removed."
          fi

      - name: Create native APT repository
        if: github.ref == 'refs/heads/native-experiment'
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev
          rm -rf native-apt
          mkdir -p native-apt
          cp built-packages/*.deb native-apt/
          native_deb="$(find native-apt -maxdepth 1 -name '*.deb' -print -quit)"
          native_version="$(dpkg-deb --field "$native_deb" Version)"
          cd native-apt
          apt-ftparchive packages . > Packages
          gzip -9c Packages > Packages.gz
          bzip2 -9c Packages > Packages.bz2
          xz -9c Packages > Packages.xz
          cd ..
          native_checksums="$(mktemp)"
          (cd native-apt && apt-ftparchive release .) > "$native_checksums"
          {
            echo "Origin: VCam Native"
            echo "Label: VCam native VideoToolbox experiment"
            echo "Suite: stable"
            echo "Version: $native_version"
            echo "Codename: vcam-native"
            echo "Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e"
            echo "Components: main"
            echo "Description: VCam WebRTC-only live-link repository"
            cat "$native_checksums"
          } > native-apt/Release
          rm -f "$native_checksums"

      - name: Publish native APT repository
        if: github.ref == 'refs/heads/native-experiment'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: native-apt
          publish_dir: ./native-apt
          force_orphan: true
